# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
#
# Internal 440.ai Hermes Agent on Render, pre-baked with Render tools.
# https://github.com/NousResearch/hermes-agent
#
# Single web service built from the local Dockerfile, which extends the
# upstream Hermes image with:
#   - The official render-oss/skills bundle, pinned at a commit
#   - The Render MCP server pre-registered in config.yaml at boot
#     with the full MCP tool catalog available to the provided API key
#
# Inside the container the gateway runs in the foreground and the
# dashboard runs as a supervised side-process (HERMES_DASHBOARD=1).
# Render's public URL serves the authenticated dashboard on port 10000; persistent
# state lives on a 5 GB disk mounted at /opt/data (HERMES_HOME default).
#
# To upgrade Hermes: bump HERMES_IMAGE in the Dockerfile and redeploy.
# To upgrade Render skills: bump RENDER_SKILLS_REF and redeploy.

services:
  - type: web
    name: hermes-internal
    runtime: docker
    region: oregon
    plan: standard
    # Render builds the image from this repo's Dockerfile on every deploy.
    # The Dockerfile FROMs the pinned upstream Hermes image and adds Render
    # tooling + the skill bundle. The upstream image keeps its s6 entrypoint.
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: off
    healthCheckPath: /api/status

    disk:
      name: hermes-data
      mountPath: /opt/data
      sizeGB: 5

    envVars:
      # The Blueprint carries vars that change how the container boots, wire
      # auth, or supply service-level secrets. Runtime state still lives on
      # the persistent /opt/data disk.

      # Dashboard side-process. The current upstream image refuses remote
      # binds unless a dashboard auth provider is configured, or unless
      # HERMES_DASHBOARD_INSECURE is explicitly enabled. Do not set insecure
      # for this internal deployment.
      - key: HERMES_HOME
        value: /opt/data
      - key: HERMES_DASHBOARD
        value: "1"
      - key: HERMES_ENABLE_DASHBOARD
        value: "1"
      - key: HERMES_DASHBOARD_HOST
        value: "0.0.0.0"
      - key: HERMES_DASHBOARD_PORT
        value: "10000"
      - key: HERMES_OVERWRITE_CONFIG
        value: "1"
      - key: HERMES_OVERWRITE_PROFILE
        value: "0"
      - key: HERMES_ACCEPT_HOOKS
        value: "1"

      # Clerk/OIDC dashboard auth. The checked-in allowlisted-oidc provider
      # wraps Clerk with an explicit Hermes-side email allowlist. Configure
      # the Clerk OAuth app with: https://ha.440.ai/auth/callback
      - key: HERMES_DASHBOARD_PUBLIC_URL
        value: https://ha.440.ai
      - key: HERMES_DASHBOARD_OIDC_ISSUER
        value: https://clerk.440.ai
      - key: HERMES_DASHBOARD_ALLOWLISTED_OIDC_SCOPES
        value: profile email
      - key: HERMES_DASHBOARD_ALLOWLISTED_OIDC_CLIENT_ID
        sync: false
      - key: HERMES_DASHBOARD_ALLOWLISTED_OIDC_CLIENT_SECRET
        sync: false
      - key: HERMES_DASHBOARD_ALLOWED_EMAILS
        value: hello@kevinwalsh.co,k@440.ai,scott@440.ai,sjtousley@gmail.com

      # Workspaces cloned at boot so terminal/file tools operate across the
      # same repos as the current internal Slack Hermes backend.
      - key: HERMES_WORKSPACE_ROOT
        value: /workspace
      - key: HERMES_WORKSPACE_REPO
        value: https://github.com/440ai/vercel-nextjs-monorepo.git
      - key: HERMES_WORKSPACE_REF
        value: main
      - key: HERMES_EXTRA_WORKSPACES
        value: wiki=https://github.com/440ai/wiki.git#main llm-wiki=https://github.com/440ai/llm-wiki.git#main hermes-render=https://github.com/440ai/hermes-render.git#main hermes-agent-gateway-slack=https://github.com/440ai/hermes-agent-gateway-slack.git#main
      - key: HERMES_WORKSPACE_AUTO_UPDATE
        value: "1"
      - key: CI
        value: "1"

      # Generated once at first deploy. Reuse this value as API_SERVER_KEY
      # in the dashboard if you later opt into the OpenAI-compatible API
      # server (API_SERVER_ENABLED=true).
      - key: HERMES_GATEWAY_TOKEN
        generateValue: true

      # Bearer token for the pre-registered Render MCP server. Generate
      # at https://dashboard.render.com/u/*/settings#api-keys and paste
      # into the dashboard's Environment tab. The boot-time patcher
      # reads ${RENDER_MCP_API_KEY} into config.yaml lazily, so you can
      # rotate by editing the env var and restarting - no rebuild needed.
      #
      # Named `RENDER_MCP_API_KEY` rather than the stock `RENDER_API_KEY`
      # to avoid accidental auto-auth if someone later installs the
      # `render` CLI. This is the same kind of Render API key; the Render
      # account role behind the key determines what the agent can do.
      - key: RENDER_MCP_API_KEY
        sync: false

      # Internal Slack gateway. Socket Mode requires both bot and app tokens.
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_APP_TOKEN
        sync: false
      - key: SLACK_ALLOWED_USERS
        sync: false
      - key: SLACK_ALLOWED_CHANNELS
        sync: false
      - key: SLACK_HOME_CHANNEL
        sync: false
      - key: SLACK_HOME_CHANNEL_NAME
        sync: false

      # Optional model/provider and repo access secrets. These can also be
      # managed later through the authenticated Hermes dashboard.
      - key: HERMES_AUTH_JSON_B64
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false

  # Actual Obsidian desktop-in-browser app for the LLM wiki.
  #
  # Keep the LinuxServer Obsidian container private. Its own docs warn that it
  # has no auth by default and includes terminal/root-capable desktop access.
  # Public traffic enters through llm-wiki-auth-proxy, which enforces OIDC.
  - type: pserv
    name: llm-wiki-obsidian
    runtime: docker
    region: oregon
    plan: standard
    dockerfilePath: ./wiki/obsidian/Dockerfile
    dockerContext: ./wiki/obsidian
    autoDeployTrigger: off

    disk:
      name: llm-wiki-obsidian-data
      mountPath: /config
      sizeGB: 10

    envVars:
      - key: PORT
        value: "10000"
      - key: CUSTOM_HTTPS_PORT
        value: "10000"
      - key: TITLE
        value: 440 LLM Wiki
      - key: PUID
        value: "1000"
      - key: PGID
        value: "1000"
      - key: TZ
        value: America/New_York
      - key: LLM_WIKI_REPO
        value: https://github.com/440ai/llm-wiki.git
      - key: LLM_WIKI_REF
        value: main
      - key: LLM_WIKI_VAULT_DIR
        value: /config/vaults/llm-wiki
      - key: HARDEN_DESKTOP
        value: "true"
      - key: DISABLE_SUDO
        value: "true"
      - key: DISABLE_TERMINALS
        value: "true"
      - key: START_DOCKER
        value: "false"
      - key: SELKIES_FILE_TRANSFERS
        value: none
      - key: GITHUB_TOKEN
        sync: false

  # Public entrypoint for the Obsidian UI. Configure the Clerk/OIDC app with:
  # https://wiki.440.ai/oauth2/callback
  - type: web
    name: llm-wiki-auth-proxy
    runtime: docker
    region: oregon
    plan: starter
    dockerfilePath: ./wiki/oauth2-proxy/Dockerfile
    dockerContext: ./wiki/oauth2-proxy
    autoDeployTrigger: off
    healthCheckPath: /ping
    domains:
      - wiki.440.ai

    envVars:
      - key: OAUTH2_PROXY_HTTP_ADDRESS
        value: 0.0.0.0:10000
      - key: OAUTH2_PROXY_PROVIDER
        value: oidc
      - key: OAUTH2_PROXY_PROVIDER_DISPLAY_NAME
        value: Clerk
      - key: OAUTH2_PROXY_OIDC_ISSUER_URL
        value: https://clerk.440.ai
      - key: OAUTH2_PROXY_SCOPE
        value: openid profile email
      - key: OAUTH2_PROXY_REDIRECT_URL
        value: https://wiki.440.ai/oauth2/callback
      - key: OAUTH2_PROXY_UPSTREAMS
        value: https://llm-wiki-obsidian:10000/
      - key: OAUTH2_PROXY_SSL_UPSTREAM_INSECURE_SKIP_VERIFY
        value: "true"
      - key: OAUTH2_PROXY_REVERSE_PROXY
        value: "true"
      - key: OAUTH2_PROXY_PROXY_WEBSOCKETS
        value: "true"
      - key: OAUTH2_PROXY_COOKIE_SECURE
        value: "true"
      - key: OAUTH2_PROXY_COOKIE_SAMESITE
        value: lax
      - key: OAUTH2_PROXY_EMAIL_DOMAINS
        value: "*"
      - key: OAUTH2_PROXY_AUTHENTICATED_EMAILS_FILE
        value: /etc/oauth2-proxy/allowed-emails.txt
      - key: OAUTH2_PROXY_WHITELIST_DOMAINS
        value: .440.ai
      - key: OAUTH2_PROXY_CLIENT_ID
        sync: false
      - key: OAUTH2_PROXY_CLIENT_SECRET
        sync: false
      - key: OAUTH2_PROXY_COOKIE_SECRET
        generateValue: true
